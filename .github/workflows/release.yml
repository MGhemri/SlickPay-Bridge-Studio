name: Release & Package CD

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release-and-publish:
    name: Build Bundles, Publish Package & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mghemri'

      - name: Run full test suite before release
        run: npm test

      - name: Build NPM tarball and cPanel Self-Hosted ZIP
        run: |
          npm pack
          zip -r slickpay-bridge-selfhosted-cpanel-${GITHUB_REF_NAME}.zip public/sdk public/api LICENSE README.md

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tgz
            slickpay-bridge-selfhosted-cpanel-*.zip
          generate_release_notes: true
