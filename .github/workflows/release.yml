name: Release & Package CD

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release-and-publish:
    name: Build Bundles, Publish Package & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mghemri'

      - name: Synchronize package.json version with Git tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          fi

      - name: Run full test suite before release
        run: npm test

      - name: Build NPM tarball and cPanel Self-Hosted ZIP
        run: |
          npm pack
          zip -r slickpay-bridge-selfhosted-cpanel-${GITHUB_REF_NAME}.zip public/sdk public/api LICENSE README.md SECURITY.md

      - name: Publish to GitHub Packages (skip if version already published)
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Package ${PKG_NAME}@${PKG_VERSION} is already published on GitHub Packages. Skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npmjs.com (if NPM_TOKEN secret is configured)
        if: env.NPM_AUTH_TOKEN != ''
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete pkg.publishConfig;
            pkg.name = "slickpay-bridge-studio";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          echo "//registry.npmjs.org/:_authToken=${NPM_AUTH_TOKEN}" > ~/.npmrc
          if ! npm view "slickpay-bridge-studio@${PKG_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            npm publish --registry=https://registry.npmjs.org/ --access public
          fi
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "@ghemrim/slickpay-bridge-studio";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          if ! npm view "@ghemrim/slickpay-bridge-studio@${PKG_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            npm publish --registry=https://registry.npmjs.org/ --access public
          fi
          git checkout package.json
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tgz
            slickpay-bridge-selfhosted-cpanel-*.zip
          generate_release_notes: true
